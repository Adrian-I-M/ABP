<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Reservar visita — PawFamily</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>

  <header class="site-header">
    <a href="index.html" class="brand">
      <img src="img/logo.png" alt="PawFamily logo" class="brand__logo" />
      <span class="brand__word">PawFamily</span>
    </a>
    <nav class="nav" aria-label="Navegación principal">
      <a href="index.html">Inicio</a>
      <a href="index.html#perros">Perros</a>
      <a href="reserva.html">Reservar visita</a>
      <a href="login.html" class="nav__login">Login</a>
    </nav>
    <button class="nav__burger" aria-label="Abrir menú" aria-expanded="false" id="burger">
      <span></span><span></span><span></span>
    </button>
  </header>

  <main class="form-page">
    <div class="form-card">
      <h1>Reserva tu visita.</h1>
      <p>Gratis y sin compromiso. Ven a conocer al perro que te ha llamado la atención.</p>
      <form id="reservaForm">
        <div class="form-group">
          <label for="nombre">Tu nombre</label>
          <input type="text" id="nombre" name="nombre" placeholder="María García" required />
        </div>
        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" placeholder="tu@email.com" required />
        </div>
        <div class="form-group">
          <label for="perro">Perro que quieres visitar</label>
          <select id="perro" name="perro" required>
            <option value="" disabled selected>Selecciona un perro...</option>
          </select>
        </div>
        <div class="form-group">
          <label for="fecha">Fecha de la visita</label>
          <input type="date" id="fecha" name="fecha" required />
        </div>
        <div class="form-group">
          <label for="notas">Notas (opcional)</label>
          <textarea id="notas" name="notas" placeholder="¿Tienes alguna pregunta o comentario?"></textarea>
        </div>
        <button type="submit" class="btn btn--primary btn--full">Confirmar reserva</button>
      </form>
      <p class="form-footer">
        <a href="index.html">← Volver al inicio</a>
      </p>
    </div>
  </main>

  <script src="js/app.js"></script>
  <script>
    const select = document.getElementById('perro');
    const disponibles = PERROS.filter(p => p.estado === 'sin-adopcion');
    disponibles.forEach(p => {
      const opt = document.createElement('option');
      opt.value = p.id;
      opt.textContent = `${p.nombre} — ${p.raza}`;
      select.appendChild(opt);
    });
    document.getElementById('fecha').min = new Date().toISOString().split('T')[0];
    document.getElementById('reservaForm').addEventListener('submit', (e) => {
      e.preventDefault();
      alert('Reserva pendiente de conectar con la API');
    });
  </script>
</body>
</html>
