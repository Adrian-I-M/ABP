<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Login — PawFamily</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>

  <header class="site-header">
    <a href="index.html" class="brand">
      <img src="img/logo.png" alt="PawFamily logo" class="brand__logo" />
      <span class="brand__word">PawFamily</span>
    </a>
    <nav class="nav" aria-label="Navegación principal">
      <a href="index.html">Inicio</a>
      <a href="index.html#perros">Perros</a>
      <a href="reserva.html">Reservar visita</a>
      <a href="login.html" class="nav__login">Login</a>
    </nav>
    <button class="nav__burger" aria-label="Abrir menú" aria-expanded="false" id="burger">
      <span></span><span></span><span></span>
    </button>
  </header>

  <main class="form-page">
    <div class="form-card">
      <h1>Bienvenido de nuevo.</h1>
      <p>Inicia sesión para gestionar tus visitas.</p>
      <form id="loginForm">
        <div class="form-group">
          <label for="login">Usuario o email</label>
          <input type="text" id="login" name="login" placeholder="tu@email.com" required />
        </div>
        <div class="form-group">
          <label for="password">Contraseña</label>
          <input type="password" id="password" name="password" placeholder="••••••••" required />
        </div>
        <button type="submit" class="btn btn--primary btn--full">Iniciar sesión</button>
      </form>
      <p class="form-footer">
        ¿No tienes cuenta? <a href="#">Regístrate gratis</a>
      </p>
    </div>
  </main>

  <script src="js/main.js"></script>
  <script>
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault(); // Evita que la página se recargue sola
      
      // 1. Capturamos lo que el usuario ha escrito en las cajas de texto
      const loginValue = document.getElementById('login').value;
      const passwordValue = document.getElementById('password').value;

      try {
        // 2. Enviamos los datos en secreto a tu servidor Flask
        const response = await fetch('http://127.0.0.1:5000/api/login', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json' // Le decimos a Flask que le enviamos un JSON
          },
          body: JSON.stringify({
            login: loginValue,
            password: passwordValue
          })
        });

        // 3. Recibimos la respuesta de Python
        const resultado = await response.json();

        if (resultado.ok) {
          alert(resultado.mensaje + ' Bienvenido, ' + resultado.usuario.nombre);
          // Aquí en el futuro redirigirías a la página privada del usuario
        } else {
          alert('Error de login: ' + resultado.error);
        }

      } catch (error) {
        console.error('Error en la comunicación:', error);
        alert('No se ha podido conectar con el servidor de Flask.');
      }
    });
  </script>
</body>
</html>
