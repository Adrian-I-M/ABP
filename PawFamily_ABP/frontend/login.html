<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Login — PawFamily</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>

  <header class="site-header">
    <a href="index.html" class="brand">
      <span class="brand__mark" aria-hidden="true">
        <svg viewBox="0 0 40 40" xmlns="http://www.w3.org/2000/svg">
          <ellipse cx="11" cy="13" rx="3.4" ry="4.4"/>
          <ellipse cx="20" cy="9"  rx="3.4" ry="4.6"/>
          <ellipse cx="29" cy="13" rx="3.4" ry="4.4"/>
          <ellipse cx="33" cy="22" rx="3"   ry="3.6"/>
          <path d="M20 18c-5.5 0-9 4.2-9 8.5 0 3.7 2.8 6 6.4 6 1.5 0 2-.5 2.6-.5s1.1.5 2.6.5c3.6 0 6.4-2.3 6.4-6 0-4.3-3.5-8.5-9-8.5z"/>
        </svg>
      </span>
      <span class="brand__word">PawFamily</span>
    </a>
  </header>

  <main class="form-page">
    <div class="form-card">
      <h1>Bienvenido de nuevo.</h1>
      <p>Inicia sesión para gestionar tus visitas.</p>

      <form id="loginForm">
        <div class="form-group">
          <label for="login">Usuario o email</label>
          <input type="text" id="login" name="login" placeholder="tu@email.com" required />
        </div>
        <div class="form-group">
          <label for="password">Contraseña</label>
          <input type="password" id="password" name="password" placeholder="••••••••" required />
        </div>
        <button type="submit" class="btn btn--primary btn--full">Iniciar sesión</button>
      </form>

      <p class="form-footer">
        ¿No tienes cuenta? <a href="#">Regístrate gratis</a>
      </p>
    </div>
  </main>

  <script>
    // Cuando el backend esté listo, conectar con POST /api/login
    document.getElementById('loginForm').addEventListener('submit', (e) => {
      e.preventDefault();
      alert('Login pendiente de conectar con la API');
    });
  </script>
</body>
</html>
