<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Login — PawFamily</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&display=swap" rel="stylesheet" />
  <link rel="icon" type="image/png" href="img/logo.png">
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>

  <header class="site-header">
    <a href="index.html" class="brand">
      <img src="img/logo.png" alt="PawFamily logo" class="brand__logo" />
      <span class="brand__word">PawFamily</span>
    </a>
        <nav class="nav" aria-label="Navegación principal">
      <a href="index.html">Inicio</a>
      <a href="index.html#perros">Perros</a>
      <a href="reserva.html">Reservar visita</a>
      <div class="nav__dropdown">
        <button class="nav__dropdown-btn">
          Protectora
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>
        </button>
        <div class="nav__dropdown-menu">
          <div class="nav__dropdown-menu-inner">
            <a href="quienesSomos.html">Quiénes somos</a>
            <a href="voluntariado.html">Voluntariado</a>
          </div>
        </div>
      </div>
      <a href="login.html" class="nav__login">Login</a>
    </nav>
    <button class="nav__burger" aria-label="Abrir menú" aria-expanded="false" id="burger">
      <span></span><span></span><span></span>
    </button>
  </header>

  <main class="form-page">
    <div class="form-card">
      <h1>Bienvenido de nuevo.</h1>
      <p>Inicia sesión para gestionar tus visitas.</p>
      <form id="loginForm">
        <div class="form-group">
          <label for="login">Usuario o email</label>
          <input type="text" id="login" name="login" placeholder="tu@email.com" required />
        </div>
        <div class="form-group">
          <label for="password">Contraseña</label>
          <input type="password" id="password" name="password" placeholder="••••••••" required />
        </div>
        <button type="submit" class="btn btn--primary btn--full">Iniciar sesión</button>
      </form>
      <p class="form-footer">
        ¿No tienes cuenta? <a href="registro.html">Regístrate gratis</a>
      </p>
    </div>
  </main>
  <script src="js/main.js"></script>
  <script src="js/validaciones.js"></script>
</body>
</html>
