<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Reservar visita — PawFamily</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>

  <header class="site-header">
    <a href="index.html" class="brand">
      <span class="brand__mark" aria-hidden="true">
        <svg viewBox="0 0 40 40" xmlns="http://www.w3.org/2000/svg">
          <ellipse cx="11" cy="13" rx="3.4" ry="4.4"/>
          <ellipse cx="20" cy="9"  rx="3.4" ry="4.6"/>
          <ellipse cx="29" cy="13" rx="3.4" ry="4.4"/>
          <ellipse cx="33" cy="22" rx="3"   ry="3.6"/>
          <path d="M20 18c-5.5 0-9 4.2-9 8.5 0 3.7 2.8 6 6.4 6 1.5 0 2-.5 2.6-.5s1.1.5 2.6.5c3.6 0 6.4-2.3 6.4-6 0-4.3-3.5-8.5-9-8.5z"/>
        </svg>
      </span>
      <span class="brand__word">PawFamily</span>
    </a>
    <nav class="nav">
      <a href="index.html">Inicio</a>
      <a href="index.html#perros">Perros</a>
      <a href="login.html" class="nav__login">Login</a>
    </nav>
  </header>

  <main class="form-page">
    <div class="form-card">
      <h1>Reserva tu visita.</h1>
      <p>Gratis y sin compromiso. Ven a conocer al perro que te ha llamado la atención.</p>

      <form id="reservaForm">
        <div class="form-group">
          <label for="nombre">Tu nombre</label>
          <input type="text" id="nombre" name="nombre" placeholder="María García" required />
        </div>
        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" placeholder="tu@email.com" required />
        </div>
        <div class="form-group">
          <label for="perro">Perro que quieres visitar</label>
          <select id="perro" name="perro" required>
            <option value="" disabled selected>Selecciona un perro...</option>
            <!-- Se rellenará con JS desde los datos de perros -->
          </select>
        </div>
        <div class="form-group">
          <label for="fecha">Fecha de la visita</label>
          <input type="date" id="fecha" name="fecha" required />
        </div>
        <div class="form-group">
          <label for="notas">Notas (opcional)</label>
          <textarea id="notas" name="notas" placeholder="¿Tienes alguna pregunta o comentario?"></textarea>
        </div>
        <button type="submit" class="btn btn--primary btn--full">Confirmar reserva</button>
      </form>

      <p class="form-footer">
        <a href="index.html">← Volver al inicio</a>
      </p>
    </div>
  </main>

  <script src="js/app.js"></script>
  <script>
    // Rellenar select con perros disponibles
    const select = document.getElementById('perro');
    const disponibles = PERROS.filter(p => p.estado === 'sin-adopcion');
    disponibles.forEach(p => {
      const opt = document.createElement('option');
      opt.value = p.id;
      opt.textContent = `${p.nombre} — ${p.raza}`;
      select.appendChild(opt);
    });

    // Bloquear fechas pasadas
    document.getElementById('fecha').min = new Date().toISOString().split('T')[0];

    // Submit — cuando el backend esté listo conectar con POST /api/visitas
    document.getElementById('reservaForm').addEventListener('submit', (e) => {
      e.preventDefault();
      alert('Reserva pendiente de conectar con la API');
    });
  </script>
</body>
</html>
